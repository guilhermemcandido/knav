[package]
name = "knav"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
crossterm = "0.29.0"
futures = "0.3.34"
http = "1.5.0"
image = "0.25.10"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "derive"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
unicode-width = "0.2"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tui-tree-widget = "0.24.1"
vt100 = "0.16.2"
