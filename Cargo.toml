[package]
name = "knav"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
futures = "0.3.34"
image = "0.25.10"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "derive"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tui-tree-widget = "0.24.1"
