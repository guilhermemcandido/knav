# Compositions are templates with no status, so they get no view. Composite resources
# are named per XRD at run time, so a manifest can't list them.

[extension]
id = "crossplane"
name = "Crossplane"
description = "Infrastructure as Kubernetes APIs: providers, XRDs and compositions"

[[extension.kind]]
group = "pkg.crossplane.io"
kind = "Provider"
category = "Crossplane"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "apiextensions.crossplane.io"
kind = "CompositeResourceDefinition"
category = "Crossplane"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "apiextensions.crossplane.io"
kind = "Composition"
category = "Crossplane"

[[extension.dashboard]]
kind = "Provider"
label = "Providers: installed"
widget = "tally"
by = "condition:Installed"

[[extension.dashboard]]
kind = "Provider"
label = "Providers: healthy"
widget = "tally"
by = "condition:Healthy"

[[extension.dashboard]]
kind = "CompositeResourceDefinition"
widget = "tally"
by = "condition:Established"

[[extension.dashboard]]
kind = "Composition"
widget = "count"
