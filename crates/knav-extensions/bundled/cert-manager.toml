# cert-manager — TLS certificate status (Certificates, CertificateRequests,
# Issuers, ClusterIssuers). A Certificate gets a curated summary (expiry,
# names, secret) instead of the generic field dump; the rest just get their
# Ready condition, which is really the only thing worth knowing about them.
# Bundled with knav, off by default; enable in the Extensions screen (E).
# Schema: see src/extensions/manifest.rs.

[extension]
id = "cert-manager"
name = "cert-manager"
description = "TLS certificates: expiry dates, issuers and pending requests"

[[extension.kind]]
group = "cert-manager.io"
kind = "Certificate"
category = "cert-manager"

  [extension.kind.view]
  template = "key_values"
  fields = [
    ["Not After", ".status.notAfter"],
    ["Renewal Time", ".status.renewalTime"],
    ["Common Name", ".spec.commonName"],
    ["DNS Names", ".spec.dnsNames"],
    ["Secret Name", ".spec.secretName"],
    ["Issuer", ".spec.issuerRef.name"],
  ]

[[extension.kind]]
group = "cert-manager.io"
kind = "CertificateRequest"
category = "cert-manager"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "cert-manager.io"
kind = "Issuer"
category = "cert-manager"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "cert-manager.io"
kind = "ClusterIssuer"
category = "cert-manager"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

# The dashboard: what's ready, what's about to expire, and a full expiry-sorted
# list (each row's Expires column is colour-coded by how soon, see manifest.rs).
[[extension.dashboard]]
kind = "Certificate"
widget = "tally"
by = "ready"

[[extension.dashboard]]
kind = "Certificate"
widget = "list"
sort_by = ".status.notAfter"
date_columns = [".status.notAfter"]
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Issuer", ".spec.issuerRef.name"],
  ["Expires", ".status.notAfter"],
]

[[extension.dashboard]]
kind = "Issuer"
extra_kinds = ["ClusterIssuer"]
label = "Issuers"
widget = "tally"
by = "ready"

[[extension.dashboard]]
kind = "CertificateRequest"
widget = "tally"
by = "ready"
