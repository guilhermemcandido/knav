[extension]
id = "flux"
name = "Flux"
description = "GitOps delivery: Kustomizations, HelmReleases and their Git/OCI sources"

[[extension.kind]]
group = "kustomize.toolkit.fluxcd.io"
kind = "Kustomization"
category = "GitOps"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "helm.toolkit.fluxcd.io"
kind = "HelmRelease"
category = "GitOps"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "source.toolkit.fluxcd.io"
kind = "GitRepository"
category = "GitOps"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "source.toolkit.fluxcd.io"
kind = "OCIRepository"
category = "GitOps"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.dashboard]]
kind = "Kustomization"
widget = "tally"
by = "ready"
suspend = ".spec.suspend"

[[extension.dashboard]]
kind = "HelmRelease"
widget = "tally"
by = "ready"
suspend = ".spec.suspend"

[[extension.dashboard]]
kind = "GitRepository"
widget = "tally"
by = "ready"
suspend = ".spec.suspend"

[[extension.dashboard]]
kind = "OCIRepository"
widget = "tally"
by = "ready"
suspend = ".spec.suspend"
