# TriggerAuthentication is left out: it holds scaler credentials and has no status.

[extension]
id = "keda"
name = "KEDA"
description = "Event-driven autoscaling: ScaledObjects and ScaledJobs"

[[extension.kind]]
group = "keda.sh"
kind = "ScaledObject"
category = "KEDA"

  [extension.kind.view]
  template = "key_values"
  fields = [
    ["Target", ".spec.scaleTargetRef.name"],
    ["Min Replicas", ".spec.minReplicaCount"],
    ["Max Replicas", ".spec.maxReplicaCount"],
  ]

[[extension.kind]]
group = "keda.sh"
kind = "ScaledJob"
category = "KEDA"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.dashboard]]
kind = "ScaledObject"
widget = "tally"
by = "condition:Active"

[[extension.dashboard]]
kind = "ScaledObject"
widget = "list"
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Target", ".spec.scaleTargetRef.name"],
  ["Min", ".spec.minReplicaCount"],
  ["Max", ".spec.maxReplicaCount"],
]

[[extension.dashboard]]
kind = "ScaledJob"
widget = "tally"
by = "condition:Active"
