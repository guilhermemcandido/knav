# Core karpenter.sh kinds only: the NodeClass varies by cloud provider.

[extension]
id = "karpenter"
name = "Karpenter"
description = "Node autoscaling: NodePools and the nodes they've launched"

[[extension.kind]]
group = "karpenter.sh"
kind = "NodePool"
category = "Karpenter"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "karpenter.sh"
kind = "NodeClaim"
category = "Karpenter"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"
