# No status view: `.status.created` is a bool, not conditions. Constraint kinds are
# named per template at run time, so a manifest can't list them.

[extension]
id = "gatekeeper"
name = "OPA Gatekeeper"
description = "Admission policy: ConstraintTemplates and whether each one took effect"

[[extension.kind]]
group = "templates.gatekeeper.sh"
kind = "ConstraintTemplate"
category = "Gatekeeper"

[[extension.dashboard]]
kind = "ConstraintTemplate"
widget = "tally"
by = "field:.status.created"

[[extension.dashboard]]
kind = "ConstraintTemplate"
widget = "list"
columns = [["Name", ".metadata.name"]]
