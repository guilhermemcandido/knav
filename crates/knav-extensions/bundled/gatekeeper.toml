# OPA Gatekeeper — constraint templates, a category and an icon to browse
# them by, not a status view (`.status.created` is a bool, not a conditions
# array). The Constraint kinds Gatekeeper generates per-template aren't
# included: they're dynamically named, same reason Crossplane's composite
# resources aren't either.
# Bundled with knav, off by default; enable in the Extensions screen (E).
# Schema: see src/extensions/manifest.rs.

[extension]
id = "gatekeeper"
name = "OPA Gatekeeper"
description = "Admission policy: ConstraintTemplates and whether each one took effect"

[[extension.kind]]
group = "templates.gatekeeper.sh"
kind = "ConstraintTemplate"
category = "Gatekeeper"

[[extension.dashboard]]
kind = "ConstraintTemplate"
widget = "tally"
by = "field:.status.created"

[[extension.dashboard]]
kind = "ConstraintTemplate"
widget = "list"
columns = [["Name", ".metadata.name"]]
