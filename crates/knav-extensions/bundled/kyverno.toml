# No status view: policy status and reports don't fit the conditions shape.

[extension]
id = "kyverno"
name = "Kyverno"
description = "Policy engine: policies and the pass/fail reports they produce"

[[extension.kind]]
group = "kyverno.io"
kind = "ClusterPolicy"
category = "Kyverno"

[[extension.kind]]
group = "kyverno.io"
kind = "Policy"
category = "Kyverno"

[[extension.kind]]
group = "wgpolicyk8s.io"
kind = "PolicyReport"
category = "Kyverno"

[[extension.kind]]
group = "wgpolicyk8s.io"
kind = "ClusterPolicyReport"
category = "Kyverno"

[[extension.dashboard]]
kind = "ClusterPolicy"
widget = "count"

[[extension.dashboard]]
kind = "Policy"
widget = "count"

# A PolicyReport's `summary` is top level, not under `.status`.
[[extension.dashboard]]
kind = "PolicyReport"
extra_kinds = ["ClusterPolicyReport"]
label = "PolicyReports"
widget = "sum"
fields = [
  ["pass", ".summary.pass"],
  ["fail", ".summary.fail"],
  ["warn", ".summary.warn"],
  ["error", ".summary.error"],
  ["skip", ".summary.skip"],
]
