# These are routing and policy config with no health signal, so there is no status view.

[extension]
id = "istio"
name = "Istio"
description = "Service mesh config: routing, gateways and security policies"

[[extension.kind]]
group = "networking.istio.io"
kind = "VirtualService"
category = "Istio"

[[extension.kind]]
group = "networking.istio.io"
kind = "Gateway"
category = "Istio"

[[extension.kind]]
group = "networking.istio.io"
kind = "DestinationRule"
category = "Istio"

[[extension.kind]]
group = "security.istio.io"
kind = "PeerAuthentication"
category = "Istio"

[[extension.kind]]
group = "security.istio.io"
kind = "AuthorizationPolicy"
category = "Istio"

# No health to tally, so the dashboard is an inventory of each kind.
[[extension.dashboard]]
kind = "VirtualService"
widget = "count"

[[extension.dashboard]]
kind = "Gateway"
widget = "count"

[[extension.dashboard]]
kind = "DestinationRule"
widget = "count"

[[extension.dashboard]]
kind = "PeerAuthentication"
widget = "count"

[[extension.dashboard]]
kind = "AuthorizationPolicy"
widget = "count"
