# These are routing and policy config with no health signal, so there is no status view.

[extension]
id = "istio"
name = "Istio"
description = "Service mesh config: routing, gateways and security policies"

[[extension.kind]]
group = "networking.istio.io"
kind = "VirtualService"
category = "Istio"

[[extension.kind]]
group = "networking.istio.io"
kind = "Gateway"
category = "Istio"

[[extension.kind]]
group = "networking.istio.io"
kind = "DestinationRule"
category = "Istio"

[[extension.kind]]
group = "security.istio.io"
kind = "PeerAuthentication"
category = "Istio"

[[extension.kind]]
group = "security.istio.io"
kind = "AuthorizationPolicy"
category = "Istio"

# No health to tally, so the dashboard is an inventory with the settings that matter:
# the mTLS mode, the policy actions and how traffic to a host is secured.
[[extension.dashboard]]
kind = "VirtualService"
widget = "count"

[[extension.dashboard]]
kind = "Gateway"
widget = "count"

[[extension.dashboard]]
kind = "DestinationRule"
label = "DestinationRule: TLS"
widget = "breakdown"
by = ".spec.trafficPolicy.tls.mode"
default = "UNSET"
values = [["ISTIO_MUTUAL", "ok"], ["MUTUAL", "ok"], ["SIMPLE", "accent"], ["DISABLE", "bad"], ["UNSET", "muted"]]

[[extension.dashboard]]
kind = "PeerAuthentication"
label = "PeerAuthentication: mTLS"
widget = "breakdown"
by = ".spec.mtls.mode"
default = "UNSET"
values = [["STRICT", "ok"], ["PERMISSIVE", "warn"], ["DISABLE", "bad"], ["UNSET", "muted"]]

[[extension.dashboard]]
kind = "AuthorizationPolicy"
label = "AuthorizationPolicy: action"
widget = "breakdown"
by = ".spec.action"
default = "ALLOW"
values = [["ALLOW", "ok"], ["DENY", "bad"], ["AUDIT", "accent"], ["CUSTOM", "warn"]]

[[extension.dashboard]]
kind = "VirtualService"
widget = "list"
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Hosts", ".spec.hosts"],
  ["Gateways", ".spec.gateways"],
]

[[extension.dashboard]]
kind = "Gateway"
widget = "list"
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Selector", ".spec.selector.istio"],
]
