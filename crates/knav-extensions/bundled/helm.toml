# Releases are read natively from Helm's Secrets (knav_k8s::helm). This manifest adds
# k3s's helm.cattle.io CRDs to the same Helm category.

[extension]
id = "helm"
name = "Helm"
description = "Installed releases with chart, revision and status, plus k3s HelmCharts"

[[extension.kind]]
group = "helm.cattle.io"
kind = "HelmChart"
category = "Helm"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "helm.cattle.io"
kind = "HelmChartConfig"
category = "Helm"
