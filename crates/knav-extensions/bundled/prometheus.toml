# Scrape and rule config (ServiceMonitor, PodMonitor, PrometheusRule) has no status,
# so it is left out. "Operator" is left out of the name: knav only reads these CRDs.

[extension]
id = "prometheus"
name = "Prometheus"
description = "Monitoring: Prometheus and Alertmanager instances and their health"

[[extension.kind]]
group = "monitoring.coreos.com"
kind = "Prometheus"
category = "Monitoring"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "monitoring.coreos.com"
kind = "Alertmanager"
category = "Monitoring"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.dashboard]]
kind = "Prometheus"
widget = "list"
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Version", ".spec.version"],
  ["Available", ".status.availableReplicas"],
  ["Replicas", ".status.replicas"],
]

[[extension.dashboard]]
kind = "Alertmanager"
widget = "list"
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Version", ".spec.version"],
  ["Available", ".status.availableReplicas"],
  ["Replicas", ".status.replicas"],
]
