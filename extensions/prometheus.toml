# Prometheus — the instances the Prometheus Operator CRDs describe
# (Prometheus, Alertmanager), from their Available/Reconciled conditions.
# ServiceMonitor, PodMonitor and PrometheusRule aren't included: they're
# scrape/rule config, not something with a status to show.
# "Operator" left out of the display name on purpose: knav only reads these
# CRDs, same as every other extension, never installs or drives the operator.
# Bundled with knav, off by default; enable in the Extensions screen (E).
# Schema: see src/extensions/manifest.rs.

[extension]
id = "prometheus"
name = "Prometheus"
description = "Prometheus and Alertmanager instances, with their condition status"

[[extension.kind]]
group = "monitoring.coreos.com"
kind = "Prometheus"
category = "Monitoring"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "monitoring.coreos.com"
kind = "Alertmanager"
category = "Monitoring"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.dashboard]]
kind = "Prometheus"
widget = "list"
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Version", ".spec.version"],
  ["Available", ".status.availableReplicas"],
  ["Replicas", ".status.replicas"],
]

[[extension.dashboard]]
kind = "Alertmanager"
widget = "list"
columns = [
  ["Name", ".metadata.name"],
  ["Namespace", ".metadata.namespace"],
  ["Version", ".spec.version"],
  ["Available", ".status.availableReplicas"],
  ["Replicas", ".status.replicas"],
]
