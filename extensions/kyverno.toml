# Kyverno — policies (cluster-wide and namespaced) and the reports they
# generate, a category and an icon to browse them by, not a status view:
# policy status and report content don't fit the conditions-array shape the
# timeline template reads.
# Bundled with knav, off by default; enable in the Extensions screen (E).
# Schema: see src/extensions/manifest.rs.

[extension]
id = "kyverno"
name = "Kyverno"
description = "ClusterPolicies, Policies and their PolicyReports"

[[extension.kind]]
group = "kyverno.io"
kind = "ClusterPolicy"
category = "Kyverno"

[[extension.kind]]
group = "kyverno.io"
kind = "Policy"
category = "Kyverno"

[[extension.kind]]
group = "wgpolicyk8s.io"
kind = "PolicyReport"
category = "Kyverno"

[[extension.kind]]
group = "wgpolicyk8s.io"
kind = "ClusterPolicyReport"
category = "Kyverno"

[[extension.dashboard]]
kind = "ClusterPolicy"
widget = "count"

[[extension.dashboard]]
kind = "Policy"
widget = "count"

# `summary` sits at the top level of a PolicyReport, not under `.status` —
# reports aren't a status subresource, they're their own object.
[[extension.dashboard]]
kind = "PolicyReport"
extra_kinds = ["ClusterPolicyReport"]
label = "PolicyReports"
widget = "sum"
fields = [
  ["pass", ".summary.pass"],
  ["fail", ".summary.fail"],
  ["warn", ".summary.warn"],
  ["error", ".summary.error"],
  ["skip", ".summary.skip"],
]
