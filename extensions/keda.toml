# KEDA — event-driven autoscaling status (ScaledObjects, ScaledJobs), the
# natural neighbor of the built-in HPA view. TriggerAuthentication isn't
# included: it's scaler credentials, not something with a status to show.
# Bundled with knav, off by default; enable in the Extensions screen (E).
# Schema: see src/extensions/manifest.rs.

[extension]
id = "keda"
name = "KEDA"
description = "ScaledObjects and ScaledJobs, with their condition status"

[[extension.kind]]
group = "keda.sh"
kind = "ScaledObject"
category = "KEDA"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"

[[extension.kind]]
group = "keda.sh"
kind = "ScaledJob"
category = "KEDA"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"
