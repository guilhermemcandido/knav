# Helm — chart installs managed as CRDs (k3s's built-in helm-controller,
# group helm.cattle.io; the Flux HelmRelease equivalent lives in flux.toml
# instead, since it's a different controller with different fields).
# Bundled with knav, off by default; enable in Settings > Extensions.
# Schema: see src/extensions/manifest.rs.

[extension]
id = "helm"
name = "Helm"
description = "HelmChart installs (k3s's helm-controller)"

[[extension.kind]]
group = "helm.cattle.io"
kind = "HelmChart"
category = "Helm"

  [extension.kind.view]
  template = "timeline"
  from = ".status.conditions"
