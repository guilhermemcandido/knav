name: release

# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Builds knav for four targets and attaches each as a .tar.gz to the GitHub
# Release for that tag, plus a checksums file the install script verifies against.
# A push to main rebuilds the release of the version in Cargo.toml, if it exists, so
# `knav update` picks up the new build without a new tag.
on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: write

# One at a time per ref, so two quick pushes can't upload over each other.
concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Macs build on Apple silicon; Intel is a cross target there.
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          # Linux builds are static (musl), so they run on any distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zig provides a C compiler for the musl targets, which ring needs.
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package the binary
        shell: bash
        run: |
          name=knav-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/knav "$name"/
          cp README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -rf "$name"
          # Bare, uncompressed, alongside the archive: what `knav update` fetches, so it
          # only has to verify a checksum and rename a file, not unpack an archive.
          cp target/${{ matrix.target }}/release/knav "$name"
          shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: knav-${{ matrix.target }}
          path: |
            knav-${{ matrix.target }}.tar.gz
            knav-${{ matrix.target }}.tar.gz.sha256
            knav-${{ matrix.target }}
            knav-${{ matrix.target }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The commit these binaries came from, so `knav update` can list what changed.
      - name: Record the commit
        run: echo "$GITHUB_SHA" > dist/knav-commit

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: src

      # Replaces the files of the current version's release, when there is one.
      - name: Rebuild the current release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            echo "No release for $tag yet; tag it to create one."
          fi
